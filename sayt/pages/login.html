<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish | 1-son Texnikumi</title>
    <link rel="icon" type="image/png" href="../assets/image/logo.png">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<main class="login-page">
    <section class="login-card" aria-labelledby="loginTitle">
        <img class="login-logo"
             src="../assets/image/logo.png"
             alt="1-son Texnikumi">

        <h1 id="loginTitle">Kirish</h1>
        <p class="login-subtitle">1-son Texnikumi o‘quvchi portaliga kirish</p>

        <form id="loginForm" novalidate>
            <div class="login-form-group">
                <label for="login">Login</label>
                <input
                    type="text"
                    id="login"
                    name="login"
                    placeholder="Masalan: 25201"
                    autocomplete="username"
                    inputmode="text"
                    required
                >
            </div>

            <div class="login-form-group">
                <label for="password">Parol</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Parolingizni kiriting"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary login-submit" id="loginSubmit">
                Kirish
            </button>

            <p id="loginMessage" class="login-message" role="status" aria-live="polite"></p>
        </form>

        <div class="login-note">
            Login va parolni texnikum administratori bergan ma’lumotlar bilan kiriting.
        </div>

        <a href="../index.html" class="login-back">← Bosh sahifaga qaytish</a>
    </section>
</main>

<script src="../js/login.js"></script>
</body>
</html>
